name: Deploy Full-Stack Application to Cloudflare

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  deploy:
    name: Build & Deploy Unified Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Unified Application
        run: npm run build
        env:
          VITE_OPENAI_API_KEY: '${{ secrets.OPENAI_API_KEY }}'
          GOOGLE_REFRESH_TOKEN: '${{ secrets.GOOGLE_REFRESH_TOKEN }}'

      - name: Generate Dynamic Sitemap
        run: node generate-sitemap.js

      - name: Ensure config files in dist
        run: |
          cp public/_redirects dist/_redirects || true
          cp public/_headers dist/_headers || true
          cp public/_routes.json dist/_routes.json || true

      - name: Upload Build Artifact (dist)
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist/

      - name: Deploy Unified App to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CF_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          command: pages deploy dist --project-name=rooh1 --branch=main --commit-dirty=true
