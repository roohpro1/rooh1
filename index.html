    <style>
      /* Initial cheerful loader styling before React bundle hydrates */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #f8fafc 0%, #eff6ff 50%, #fef2f2 100%);
        z-index: 999999;
        font-family: system-ui, -apple-system, sans-serif;
        direction: rtl;
      }
      .red-spinner {
        width: 54px;
        height: 54px;
        border: 4px solid #fee2e2;
        border-top: 4px solid #dc2626;
        border-right: 4px solid #ef4444;
        border-radius: 50%;
        animation: spin-pulse 0.9s linear infinite;
        box-shadow: 0 0 15px rgba(220, 38, 38, 0.25);
      }
      @keyframes spin-pulse {
        0% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(180deg) scale(1.05); }
        100% { transform: rotate(360deg) scale(1); }
      }
    </style>
