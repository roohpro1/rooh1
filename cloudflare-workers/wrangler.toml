# wrangler.toml - Cloudflare Worker Configuration for Rooh Platform
name = "discover-app"
account_id = "fa73541af4fcdd947ab78c12fe990a34"
main = "src/index.ts"
compatibility_date = "2024-09-01"

# D1 Database Binding
[[d1_databases]]
binding = "h"
database_name = "h"
database_id = "8480585e-443f-4ef9-b4e4-45c941c9dbf1"

# KV Namespace Binding
[[kv_namespaces]]
binding = "ROOH_KV"
namespace_id = "6d9110610f2c45b09c15d3f2f5dee50a"

# R2 Bucket Binding
[[r2_buckets]]
binding = "roohme"
bucket_name = "roohme"

[[r2_buckets]]
binding = "ROOH_R2"
bucket_name = "roohme"

[[r2_buckets]]
binding = "REVIEWS_BUCKET"
bucket_name = "roohme"

# Environment Variables
[vars]
FIREBASE_PROJECT_ID = ""
SITE_BASE_URL = "https://roohpro.com"

