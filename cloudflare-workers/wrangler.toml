# wrangler.toml - Cloudflare Worker Configuration for Rooh Platform
name = "rooh-platform-worker"
main = "src/index.ts"
compatibility_date = "2026-03-01"

# KV Storage
[[kv_namespaces]]
binding = "ROOH_KV"
id = "26eb0eb8146643979c86545a7d9d436b"

# R2 Storage
[[r2_buckets]]
binding = "ROOH_R2"
bucket_name = "rooh-r2-storage"

[[r2_buckets]]
binding = "REVIEWS_BUCKET"
bucket_name = "roohme"

# Environment Variables
[vars]
FIREBASE_PROJECT_ID = "ai-studio-remixremixremixr-f90e7953-c5a1-4541-b13d-95e6eb5f6d0b"
SITE_BASE_URL = "https://roohme.web.app"
